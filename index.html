<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descobrindo Brusque 🎈</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Tela inicial -->
<div id="screen-home" class="screen active">

  <!-- Manchas -->
  <div class="blobs">
    <svg width="220" height="220" viewBox="0 0 220 220" style="top:-40px;left:-40px">
      <ellipse cx="100" cy="100" rx="110" ry="100" fill="#F5C842" opacity="0.7"/>
    </svg>
    <svg width="180" height="260" viewBox="0 0 180 260" style="top:60px;left:0">
      <path d="M0,80 Q30,0 80,40 Q140,90 100,200 Q60,280 0,220 Z" fill="#4FC3C4" opacity="0.55"/>
    </svg>
    <svg width="200" height="300" viewBox="0 0 200 300" style="bottom:0;left:100px">
      <path d="M60,300 Q0,220 20,140 Q50,60 120,80 Q200,100 180,200 Q160,300 60,300 Z" fill="#E8734A" opacity="0.75"/>
    </svg>
    <svg width="220" height="320" viewBox="0 0 220 320" style="right:0;top:0">
      <path d="M220,0 Q260,80 200,160 Q160,240 220,320 L220,0 Z" fill="#E8734A" opacity="0.6"/>
    </svg>
    <svg width="160" height="200" viewBox="0 0 160 200" style="right:30px;bottom:0">
      <path d="M80,200 Q0,160 20,80 Q40,0 120,20 Q200,40 160,120 Q130,200 80,200 Z" fill="#4FC3C4" opacity="0.5"/>
    </svg>
    <!-- Folhinhas -->
    <svg width="80" height="80" viewBox="0 0 80 80" style="bottom:60px;left:60px;opacity:0.5">
      <ellipse cx="40" cy="40" rx="30" ry="18" fill="#4FC3C4" transform="rotate(-30 40 40)"/>
      <line x1="40" y1="58" x2="40" y2="20" stroke="#2D2D2D" stroke-width="1.5"/>
    </svg>
    <svg width="60" height="60" viewBox="0 0 60 60" style="bottom:30px;right:180px;opacity:0.4">
      <ellipse cx="30" cy="30" rx="22" ry="14" fill="#F5C842" transform="rotate(20 30 30)"/>
      <line x1="30" y1="44" x2="30" y2="16" stroke="#2D2D2D" stroke-width="1.5"/>
    </svg>
  </div>

  <span class="top-bar">Configurações ⚙️</span>

  <h1 class="game-title" style="margin-bottom:32px; position:relative; z-index:2">
    Descobrindo Brusque
  </h1>

  <div class="content">
    <div class="left-col">
      <!-- Imagem principal -->
      <img src="assets/imgs/ilustracao_criancas_baloes.png"
           alt="Crianças comemorando com balões"
           onerror="this.src='assets/imgs/ilustracao_criancas_baloes.png'">
    </div>
    <div class="right-col">
      <button class="btn btn-primary" onclick="startGame()">INICIAR!</button>
      <p class="subtitle">
        Aprenda sobre a história e cultura da nossa cidade de um jeito divertido!
      </p>
    </div>
  </div>

  <div class="footer-btns">
    <button class="btn btn-dark" onclick="goHome()">HOME</button>
  </div>
</div>


<!-- Tela do quiz -->
<div id="screen-quiz" class="screen">

  <!-- Barra de progresso -->
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <!-- Manchas -->
  <div class="blobs">
    <svg width="200" height="200" viewBox="0 0 200 200" style="top:-50px;left:-50px">
      <ellipse cx="90" cy="90" rx="100" ry="90" fill="#F5C842" opacity="0.45"/>
    </svg>
    <svg width="180" height="240" viewBox="0 0 180 240" style="top:40px;left:0">
      <path d="M0,60 Q30,0 80,30 Q140,70 100,180 Q60,260 0,200 Z" fill="#4FC3C4" opacity="0.35"/>
    </svg>
    <svg width="200" height="300" viewBox="0 0 200 300" style="bottom:0;left:60px">
      <path d="M60,300 Q0,220 20,140 Q50,60 120,80 Q200,100 180,200 Q160,300 60,300 Z" fill="#E8734A" opacity="0.5"/>
    </svg>
    <svg width="180" height="300" viewBox="0 0 180 300" style="right:0;top:0">
      <path d="M180,0 Q220,80 160,160 Q120,240 180,300 L180,0 Z" fill="#E8734A" opacity="0.4"/>
    </svg>
    <svg width="140" height="180" viewBox="0 0 140 180" style="right:20px;bottom:0">
      <path d="M70,180 Q0,140 20,70 Q40,0 110,20 Q180,40 140,110 Q110,180 70,180 Z" fill="#4FC3C4" opacity="0.35"/>
    </svg>
    <svg width="60" height="60" viewBox="0 0 60 60" style="bottom:60px;left:50px;opacity:0.45">
      <ellipse cx="30" cy="30" rx="22" ry="14" fill="#4FC3C4" transform="rotate(-30 30 30)"/>
      <line x1="30" y1="44" x2="30" y2="16" stroke="#2D2D2D" stroke-width="1.5"/>
    </svg>
    <svg width="55" height="55" viewBox="0 0 55 55" style="bottom:80px;right:160px;opacity:0.4">
      <ellipse cx="27" cy="27" rx="20" ry="13" fill="#F5C842" transform="rotate(20 27 27)"/>
      <line x1="27" y1="40" x2="27" y2="14" stroke="#2D2D2D" stroke-width="1.5"/>
    </svg>
  </div>

  <span class="top-bar" id="question-num">1 / 15</span>

  <h2 class="question-text" id="question-text">Onde fica Brusque?</h2>

  <div class="options-grid" id="options-grid"></div>

  <div class="footer-btns">
    <button class="btn btn-dark" onclick="goHome()">HOME</button>
  </div>
</div>


<!-- Tela de erro -->
<div id="screen-wrong" class="screen result-screen">

  <div class="blobs">
    <svg width="200" height="200" viewBox="0 0 200 200" style="top:-50px;left:-50px">
      <ellipse cx="90" cy="90" rx="100" ry="90" fill="#F5C842" opacity="0.45"/>
    </svg>
    <svg width="180" height="300" viewBox="0 0 180 300" style="top:40px;left:0">
      <path d="M0,60 Q30,0 80,30 Q140,70 100,180 Q60,260 0,200 Z" fill="#4FC3C4" opacity="0.35"/>
    </svg>
    <svg width="200" height="300" viewBox="0 0 200 300" style="bottom:0;left:60px">
      <path d="M60,300 Q0,220 20,140 Q50,60 120,80 Q200,100 180,200 Q160,300 60,300 Z" fill="#E8734A" opacity="0.5"/>
    </svg>
    <svg width="180" height="300" viewBox="0 0 180 300" style="right:0;top:0">
      <path d="M180,0 Q220,80 160,160 Q120,240 180,300 L180,0 Z" fill="#E8734A" opacity="0.4"/>
    </svg>
    <svg width="140" height="180" viewBox="0 0 140 180" style="right:20px;bottom:0">
      <path d="M70,180 Q0,140 20,70 Q40,0 110,20 Q180,40 140,110 Q110,180 70,180 Z" fill="#4FC3C4" opacity="0.35"/>
    </svg>
  </div>

  <div class="result-layout">
    <img class="mascot" src="assets/imgs/ilustracao_criancas_baloes.png"
         alt="Mascote"
         onerror="this.src='assets/imgs/ilustracao_criancas_baloes.png'">
    <div class="result-actions">
      <h2 class="result-title">Tente<br>Novamente!!!</h2>
      <button class="btn btn-primary" onclick="retryQuestion()">NOVAMENTE</button>
    </div>
  </div>

  <div class="footer-btns">
    <button class="btn btn-dark" onclick="goHome()">HOME</button>
  </div>
</div>


<!-- Tela de vitória -->
<div id="screen-win" class="screen result-screen">

  <div class="blobs">
    <svg width="200" height="200" viewBox="0 0 200 200" style="top:-50px;left:-50px">
      <ellipse cx="90" cy="90" rx="100" ry="90" fill="#F5C842" opacity="0.45"/>
    </svg>
    <svg width="180" height="300" viewBox="0 0 180 300" style="top:40px;left:0">
      <path d="M0,60 Q30,0 80,30 Q140,70 100,180 Q60,260 0,200 Z" fill="#4FC3C4" opacity="0.35"/>
    </svg>
    <svg width="200" height="300" viewBox="0 0 200 300" style="bottom:0;left:60px">
      <path d="M60,300 Q0,220 20,140 Q50,60 120,80 Q200,100 180,200 Q160,300 60,300 Z" fill="#E8734A" opacity="0.5"/>
    </svg>
    <svg width="180" height="300" viewBox="0 0 180 300" style="right:0;top:0">
      <path d="M180,0 Q220,80 160,160 Q120,240 180,300 L180,0 Z" fill="#E8734A" opacity="0.4"/>
    </svg>
    <svg width="140" height="180" viewBox="0 0 140 180" style="right:20px;bottom:0">
      <path d="M70,180 Q0,140 20,70 Q40,0 110,20 Q180,40 140,110 Q110,180 70,180 Z" fill="#4FC3C4" opacity="0.35"/>
    </svg>
  </div>

  <h2 class="result-title">PARABÉNS!!!!!</h2>

  <div class="result-layout">
    <img class="mascot" src="assets/imgs/ilustracao_criancas_baloes.png"
         alt="Crianças comemorando"
         onerror="this.src='assets/imgs/ilustracao_criancas_baloes.png'">
    <div class="result-actions">
      <p class="score-badge" id="score-display">Você acertou todas!</p>
      <button class="btn btn-primary" onclick="playAgain()">NOVAMENTE</button>
    </div>
  </div>

  <div class="footer-btns">
    <button class="btn btn-dark" onclick="goHome()">HOME</button>
  </div>
</div>


<script src="js/game.js"></script>
</body>
</html>
